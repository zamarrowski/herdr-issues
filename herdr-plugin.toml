id = "zamarrowski.issues"
name = "Issues"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Browse GitHub issues, Shortcut stories and Linear issues in a popup and hand one to any coding agent in its own git worktree"
platforms = ["macos", "linux"]

# Fetches highlight.js, the only dependency, for syntax highlighting in code blocks. herdr runs this
# after `herdr plugin install` once you confirm. Without it the plugin still works; code blocks are plain.
[[build]]
command = ["npm", "ci", "--omit=dev", "--no-fund", "--no-audit"]

# ── actions (bind them with [[keys.command]] type = "plugin_action") ─────────

[[actions]]
id = "open"
title = "Issues: browse GitHub issues, Shortcut stories and Linear issues"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin zamarrowski.issues --entrypoint browser --focus"]

# From a keybinding it asks for an issue number, sc-<id>, ENG-123 or URL; from a Ctrl+click on an issue or story URL it starts that one.
[[actions]]
id = "start"
title = "Issues: start an issue or a story in a new worktree"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin zamarrowski.issues --entrypoint start --focus --env \"HERDR_ISSUES_URL=$HERDR_PLUGIN_CLICKED_URL\""]

[[actions]]
id = "setup"
title = "Issues: checks, keybindings and config"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin zamarrowski.issues --entrypoint setup --focus"]

# ── popups ───────────────────────────────────────────────────────────────────

[[panes]]
id = "browser"
title = "Issues"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "bin/run.sh", "scripts/issues.mjs"]

[[panes]]
id = "start"
title = "Start issue"
placement = "popup"
width = "75%"
height = "60%"
command = ["sh", "bin/run.sh", "scripts/start.mjs"]

[[panes]]
id = "setup"
title = "Issues setup"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "bin/run.sh", "scripts/setup.mjs"]

# ── Ctrl+click on a GitHub issue, Shortcut story or Linear issue URL in any pane

[[link_handlers]]
id = "github-issue"
title = "Start this issue in a worktree"
pattern = "^https://github\\.com/[^/]+/[^/]+/issues/[0-9]+(?:[/?#].*)?$"
action = "start"

[[link_handlers]]
id = "shortcut-story"
title = "Start this story in a worktree"
pattern = "^https://app\\.shortcut\\.com/[^/]+/story/[0-9]+(?:[/?#].*)?$"
action = "start"

[[link_handlers]]
id = "linear-issue"
title = "Start this issue in a worktree"
pattern = "^https://linear\\.app/[^/]+/issue/[A-Za-z][A-Za-z0-9]*-[0-9]+(?:[/?#].*)?$"
action = "start"
