name: Agent quirk
description: An agent shows a startup dialog the plugin does not recognise, or needs something else to start.
labels: [agent]
body:
  - type: input
    id: agent
    attributes:
      label: Agent kind and version
      placeholder: gemini 0.12.0
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: What the pane shows
      description: "Exact text, from `herdr agent read <pane> --source visible` while the agent is blocked."
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Which answer is the right one, and whether it is safe to give it automatically.
  - type: input
    id: herdr
    attributes:
      label: herdr version
      placeholder: 0.9.1
