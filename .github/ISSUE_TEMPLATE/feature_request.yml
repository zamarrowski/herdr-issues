name: Feature request
description: Something the plugin should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working (keys, config, command line). Alternatives you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This should work for any agent herdr supports, not just one.
