name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install highlight.js
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Scripts run without a TTY
        run: |
          sh bin/run.sh scripts/start.mjs --help
          sh bin/run.sh scripts/issues.mjs --help
          sh bin/run.sh scripts/setup.mjs --help
